services:
  minecraft:
    image: itzg/minecraft-server
    container_name: mc_server
    networks:
      - rede_mine
    ports:
      - "25565:25565"
      - "127.0.0.1:25575:25575"
    environment:
      EULA: "TRUE"
      TYPE: "${MC_TYPE:-VANILLA}"
      VERSION: "${MC_VERSION:-latest}"
      MEMORY: "${MC_MEMORY:-4G}"
      ONLINE_MODE: "${MC_ONLINE_MODE:-TRUE}"
    volumes:
      - ./dados_mine:/data
    restart: unless-stopped

  playit:
    image: alpine:latest
    container_name: mc_playit
    networks:
      - rede_mine
    depends_on:
      - minecraft
    volumes:
      - ./playit_config:/etc/playit
    command: >
      sh -c "if [ ! -s /etc/playit/playit-linux-amd64 ]; then
        apk add --no-cache curl &&
        curl -sL https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -o /etc/playit/playit-linux-amd64;
      fi &&
      cp /etc/playit/playit-linux-amd64 /usr/local/bin/playit &&
      chmod +x /usr/local/bin/playit &&
      /usr/local/bin/playit"
    restart: unless-stopped

networks:
  rede_mine:
    driver: bridge
